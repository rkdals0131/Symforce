# ---------------------------------------------
# Sensor Configuration
# ---------------------------------------------

# IMU0 - Ouster IMU simulator
imu0: /ouster/imu_sim
imu0_config: [false, false, false,  # x, y, z
              true,  true,  true,   # roll, pitch, yaw (orientation)
              false, false, false,  # vx, vy, vz
              true,  true,  true,   # vroll, vpitch, vyaw (angular velocity)
              true,  true,  true]   # ax, ay, az (linear acceleration)
imu0_differential: false
imu0_relative: true
imu0_queue_size: 50
imu0_remove_gravitational_acceleration: true

# GPS0 - Position from GPS
gps0: /ublox_gps_node/fix_sim
gps0_config: [true,  true,  false,  # x, y, z (position)
              false, false, false,  # roll, pitch, yaw
              false, false, false,  # vx, vy, vz
              false, false, false,  # vroll, vpitch, vyaw
              false, false, false]  # ax, ay, az
gps0_differential: false
gps0_relative: false
gps0_queue_size: 10

# GPS1 - Velocity from GPS (separate topic)
gps1: /ublox_gps_node/fix_velocity_sim
gps1_config: [false, false, false,  # x, y, z
              false, false, false,  # roll, pitch, yaw
              true,  true,  false,  # vx, vy, vz (velocity)
              false, false, false,  # vroll, vpitch, vyaw
              false, false, false]  # ax, ay, az
gps1_differential: false
gps1_relative: false
gps1_queue_size: 10

# ODOM0 - Wheel odometry with drift
odom0: /odom_sim
odom0_config: [true,  true,  false,  # x, y, z (position)
               false, false, true,   # roll, pitch, yaw (orientation)
               true,  true,  false,  # vx, vy, vz (linear velocity)
               false, false, true,   # vroll, vpitch, vyaw (angular velocity)
               false, false, false]  # ax, ay, az
odom0_differential: false
odom0_relative: false
odom0_queue_size: 50

# If true, will dynamically scale the process noise covariance based on velocity
dynamic_process_noise_covariance: false

# Whether to reset the filter on a service call
reset_on_time_jump: true