# EKF Configuration for sensor fusion
# Fuses IMU, GPS, and Odometry data into /odom_sim_fusion

# The frequency at which the filter will output a position estimate
frequency: 30.0

# The period, in seconds, after which we consider a sensor to have timed out
sensor_timeout: 0.2

# If set to true, uses 2D mode (constrains estimate to x, y, yaw)
two_d_mode: true

# REP-105 (http://www.ros.org/reps/rep-0105.html) specifies:
# - earth: The origin of ECEF at the earth's center of mass
# - map: Gravity-aligned
# - odom: Continuous, but drifts
# - base_link: Rigidly attached to robot

# World frame is the frame in which your filter's first output pose is given
world_frame: odom

# This is the frame your filter will output to
odom_frame: odom_sim_fusion

# The robot's body frame
base_link_frame: base_link

# Whether to broadcast the transform between the odom_frame and the base_link_frame
publish_tf: true

# Process noise covariance (Q)
# This represents uncertainty in the prediction model
# Diagonal: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
